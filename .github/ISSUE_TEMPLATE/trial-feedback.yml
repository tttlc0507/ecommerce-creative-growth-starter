name: 试用反馈 / Trial feedback
description: 告诉我们建议是否具体、可执行，以及哪一步最费力。
title: "[试用反馈] "
body:
  - type: markdown
    attributes:
      value: "感谢试用。此表提交后公开可见，请勿上传客户图片、店铺后台、订单或账号资料。可使用虚构或已获准公开的内容。"
  - type: dropdown
    id: role
    attributes:
      label: 你的使用角色
      options:
        - 运营
        - 设计
        - 商家
        - 其他
  - type: input
    id: host
    attributes:
      label: 使用的 AI 助手与版本（如知道）
  - type: textarea
    id: task
    attributes:
      label: 本次任务与使用位置
      description: 概括任务即可，不需要真实品牌、客户或数据。
    validations:
      required: true
  - type: dropdown
    id: actionable
    attributes:
      label: 修改建议能否直接执行？
      options:
        - 可以执行，已采用部分建议
        - 大体能懂，但还需补充说明
        - 过于泛泛，不能执行
        - 尚未完成
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 哪项有用，哪项需要改进？
      description: 可以说是否减少沟通、是否愿意继续下一版；不要贴私有材料。
    validations:
      required: true
