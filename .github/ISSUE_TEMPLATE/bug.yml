name: 问题报告 / Bug report
description: 报告技能或本地脚本的问题，使用虚构输入复现。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "此报告公开可见。请使用最小虚构输入，不上传业务文件、账号或密钥。"
  - type: input
    id: environment
    attributes:
      label: 宿主或 Python 版本
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
